<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 200" role="img" aria-label="BTR 社会赛事平台">
  <defs>
    <clipPath id="hwordmark">
      <text x="100" y="132" text-anchor="middle"
            font-family="Inter, 'Helvetica Neue', Arial, sans-serif"
            font-size="96" font-weight="700" letter-spacing="-4">BTR</text>
    </clipPath>
    <linearGradient id="hsheen" x1="0" y1="0" x2="1" y2="0.35">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.52" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.78" stop-color="#d8d8d8" stop-opacity="1"/>
      <stop offset="1" stop-color="#9b9b9b" stop-opacity="1"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="200" height="200" rx="44" fill="#050505"/>
  <g clip-path="url(#hwordmark)">
    <rect x="0" y="0" width="200" height="200" fill="#ffffff"/>
