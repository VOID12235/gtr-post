spring:
  application:
    name: btr-platform
  profiles:
    default: dev
  datasource:
    url: jdbc:h2:file:./data/btr;MODE=MySQL;DATABASE_TO_LOWER=TRUE;AUTO_SERVER=TRUE
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration/{vendor}
    baseline-on-migrate: true
  h2:
    console:
      enabled: true
      path: /h2-console
  jackson:
    default-property-inclusion: non_null
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 55MB

server:
  port: 8080
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

btr:
  jwt:
    secret: ${JWT_SECRET:dev-secret-change-me-please-32-bytes-minimum}
    access-ttl: PT2H
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  captcha:
    enabled: ${CAPTCHA_ENABLED:true}
  config:
    secret: ${CONFIG_SECRET:}
  upload:
    dir: ${UPLOAD_DIR:./uploads}
  bootstrap:
    tenant-code: demo
    tenant-name: 示例科技
    admin-account: ${ADMIN_ACCOUNT:admin}
    admin-password: ${ADMIN_PASSWORD:admin123}
    admin-nickname: ${ADMIN_NICKNAME:平台管理员}
